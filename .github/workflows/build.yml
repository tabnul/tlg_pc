# (Linux builds as an artifact; releases stay Windows only until it is tested: tabnul/tlg_pc#1.)
# Pull requests to master (from integration) build the Windows package, kept as a run artifact for 3
# days. Only a pushed tag v* (e.g. v0.2) publishes a release, named after that tag and marked latest.
# Every release is kept as version history. No game or console file is ever built in or uploaded.
name: Build

on:
  push:
    tags: ['v*']
  # Pull requests to master build the package (artifact only): the Release is left untouched.
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Linux: built and kept as a run artifact; the release job still ships Windows only until
  # the package is tested (tabnul/tlg_pc#1).
  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: port
    env:
      CC: gcc-14
      CXX: g++-14
      PKG_CONFIG_PATH: /opt/tlgdeps/lib/pkgconfig:/opt/tlgdeps/lib64/pkgconfig:/opt/tlgdeps/lib/x86_64-linux-gnu/pkgconfig
      CMAKE_PREFIX_PATH: /opt/tlgdeps
      LD_LIBRARY_PATH: /opt/tlgdeps/lib:/opt/tlgdeps/lib64:/opt/tlgdeps/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: System packages
        # 2026-10-23 this step hung in apt-get for hours: fail fast instead, a re-run gets a mirror.
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-14 g++-14 cmake ninja-build pkg-config nasm \
            curl git python3-venv python3-tk libvulkan-dev glslang-tools libboost-dev \
            libxxhash-dev zlib1g-dev libx11-dev libxcb1-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl-dev libgl-dev libdrm-dev libgbm-dev libpulse-dev libasound2-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev libusb-1.0-0-dev
      - name: Cache built libraries
        id: deps
        uses: actions/cache@v4
        with:
          path: /opt/tlgdeps
          key: tlgdeps-ubuntu2404-${{ hashFiles('port/packaging/linux/build_deps.sh') }}
      - name: Build libraries (SDL3, Zydis, fmt, FFmpeg)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/tlgdeps && sudo chown "$USER" /opt/tlgdeps
          bash packaging/linux/build_deps.sh
      - name: Build
        run: |
          # Keep compilation progress visible while build.sh captures Ninja's full log.
          (while sleep 30; do
            echo "Build running: $(date -u +%H:%M:%S) UTC"
            tail -n 2 out/gpu-build.log 2>/dev/null || true
          done) &
          progress_pid=$!
          trap 'kill "$progress_pid" 2>/dev/null || true' EXIT
          TLG_LTO=OFF TLG_PGO=off bash build.sh
      - name: Package
        run: bash packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tlg-linux-x86_64
          path: port/dist/tlg-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 3

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: port
    steps:
      # LF checkout: the fsr-vulkan patches are LF (.gitattributes), the submodule sources must match.
      - run: git config --global core.autocrlf false
        shell: pwsh
        working-directory: .
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers mingw-w64-clang-x86_64-spirv-cross
      - name: Build
        env:
          MSYS2_ROOT: ${{ runner.temp }}/msys64
        run: |
          export MSYS2_ROOT=$(cygpath -u "$MSYS2_ROOT")
          # Keep compilation progress visible while build.sh captures Ninja's full log.
          (while sleep 30; do
            echo "Build running: $(date -u +%H:%M:%S) UTC"
            tail -n 2 out/gpu-build.log 2>/dev/null || true
          done) &
          progress_pid=$!
          trap 'kill "$progress_pid" 2>/dev/null || true' EXIT
          TLG_LTO=OFF bash build.sh
      - name: Regression - speculative fault recovery
        run: python -m unittest discover -s tests -p test_windows_fault_recovery.py -v
      # DLAA: NVIDIA's DLSS SDK (pinned release) and the MSVC bridge (gpu/dlss_bridge). The SDK
      # license allows shipping nvngx_dlss.dll with the application; NVIDIA's license text ships too.
      - name: DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: v310.9.16
          path: dlss-sdk
      - name: DLSS bridge
        run: |
          DLSS_SDK_ROOT=$(cygpath -u "$GITHUB_WORKSPACE")/dlss-sdk \
          CMAKE_EXE="/c/Program Files/CMake/bin/cmake.exe" bash packaging/windows/build_dlss.sh
      - name: Package
        env:
          MSYS2_ROOT: ${{ runner.temp }}/msys64
          WINPYTHON_WIN: ${{ steps.python.outputs.python-path }}
          TLG_REQUIRE_DLSS: '1'
        run: |
          export MSYS2_ROOT=$(cygpath -u "$MSYS2_ROOT")
          export WINPYTHON=$(cygpath -u "$WINPYTHON_WIN")
          bash packaging/windows/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tlg-windows-x86_64
          path: port/dist/tlg-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 3

  release:
    # Linux: needs: [linux, windows]
    needs: [windows]
    # Only a pushed v* tag publishes; master pushes and pull requests stop at the artifacts.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/release-template.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        id: publish
        run: |
          set -euo pipefail
          ls -la dist
          # Linux: test -f dist/tlg-linux-x86_64.tar.gz && test -f dist/tlg-windows-x86_64.zip
          test -f dist/tlg-windows-x86_64.zip
          short=${GITHUB_SHA::7}
          # Linux: the template's Download list gets "- Linux x86-64 (glibc 2.39+): `tlg-linux-x86_64.tar.gz`" above Windows.
          tag=$GITHUB_REF_NAME
          # The notes are .github/release-template.md, with {{CHANGES}} taken from the annotated
          # tag's message (git tag -a v0.2 -m "..."). A lightweight tag leaves that part out.
          git fetch -q --depth=1 origin "+refs/tags/$tag:refs/tags/$tag"
          : > changes.md
          if [[ $(git cat-file -t "$tag") == tag ]]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$tag" > changes.md
          fi
          python3 - "$tag" "$short" "$GH_REPO" <<'PY'
          import sys
          tag, commit, repo = sys.argv[1:]
          notes = open('.github/release-template.md', encoding='utf-8').read()
          changes = open('changes.md', encoding='utf-8').read().strip()
          for key, value in (('CHANGES', changes), ('TAG', tag), ('COMMIT', commit), ('REPO', repo)):
              notes = notes.replace('{{' + key + '}}', value)
          open('notes.md', 'w', encoding='utf-8').write(notes.lstrip())
          PY
          # A re-run of the same commit finds its release already published: keep it.
          if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # SHA256SUMS: the launcher's updater checks the downloaded package against it.
          # Linux: (cd dist && sha256sum tlg-linux-x86_64.tar.gz tlg-windows-x86_64.zip > SHA256SUMS)
          (cd dist && sha256sum tlg-windows-x86_64.zip > SHA256SUMS)
          # Upload into a draft first, so a failed upload never leaves a half-published release.
          # Releases are kept forever as version history; nothing here deletes one.
          # --verify-tag: the pushed tag is used as is. With --target the API may create a tag,
          # which the workflow token is refused for commits that change workflow files (HTTP 403).
          gh release create "$tag" dist/* --draft --verify-tag \
            --title "$tag ($(date -u +%Y-%m-%d) · ${short})" --notes-file notes.md
          n=$(gh release view "$tag" --json assets --jq '.assets | length')
          # Linux: [[ $n -ge 3 ]]
          [[ $n -ge 2 ]] || { echo "draft release has $n assets"; exit 1; }
          for try in 1 2 3; do
            gh release edit "$tag" --draft=false --latest && break
            sleep 10
          done
          [[ $(gh release view "$tag" --json isDraft --jq .isDraft) == false ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The old rolling "nightly" release is gone: every build is now its own release.
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
      - name: Delete older builds
        # Only after the new release is live: the previous runs and their artifacts go, the
        # current run (the one that produced this release) stays. Releases are not touched,
        # apart from leftover nightly-staging drafts of failed runs.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -uo pipefail
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft and (.tagName | startswith("nightly-staging-"))) | .tagName' |
            while read -r t; do gh release delete "$t" --yes || true; done
          gh run list --workflow build.yml --status completed --limit 200 --json databaseId --jq '.[].databaseId' |
            grep -vx "$GITHUB_RUN_ID" | xargs -r -n1 gh run delete || true
